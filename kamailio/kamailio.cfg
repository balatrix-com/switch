#!KAMAILIO
#
# billing-switch SIP proxy
#
# Call legs:
#   Carrier  -> Kamailio -> FreeSWITCH  (inbound)
#   Customer -> Kamailio -> FreeSWITCH  (outbound)
#   FreeSWITCH -> Kamailio -> customer endpoint or carrier endpoint
#
# The Node backend owns configuration and pre-generates XML. The separate
# freeswitch-curl-service returns that saved XML. Kamailio only validates a
# source IP, marks its direction, and relays SIP to the XML-selected target.

####### Change these deployment values before loading this file #######
#!define KAM_DBURL      "postgres://kamailio:OnidaMaruti1)@localhost:5432/kamailio"
#!define FS_URI         "sip:10.30.0.61:5080"
#!define FS_IP          "10.30.0.61"
#!define PUBLIC_IP      "91.99.251.61"
#!define LAN_IP         "10.30.0.61"

#!define CARRIER_GRP    1
#!define CUSTOMER_GRP   2

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
fork=yes
children=8
tcp_children=2
tcp_accept_no_cl=yes
auto_aliases=no

####### SIP and management sockets #######
# PUBLIC_IP is the address used by carrier/customer endpoints.
listen=udp:91.99.251.61:5060 advertise 91.99.251.61:5060
listen=tcp:91.99.251.61:5060 advertise 91.99.251.61:5060

# LAN_IP is used only for the FreeSWITCH <-> Kamailio leg.
listen=udp:10.30.0.61:5070 advertise 10.30.0.61:5070
listen=tcp:10.30.0.61:5070 advertise 10.30.0.61:5070
listen=tcp:10.30.0.61:8080 advertise 10.30.0.61:8080

####### Modules #######
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "pv.so"
loadmodule "sanity.so"
loadmodule "siputils.so"
loadmodule "db_postgres.so"
loadmodule "permissions.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "siptrace.so"

####### Module parameters #######
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("rr", "enable_double_rr", 2)
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "auto_inv_100", 1)

# The address table is the SIP edge allow-list. SourceIpAuth entries are
# synchronized with groups 1 (carrier) and 2 (customer) by sync_source_auth.py.
modparam("permissions", "db_url", KAM_DBURL)
modparam("permissions", "address_table", "address")

modparam("xhttp", "url_match", "^/")
modparam("jsonrpcs", "fifo_name", "/run/kamailio/kamailio_rpc.fifo")
modparam("jsonrpcs", "transport", 1)
modparam("jsonrpcs", "pretty_format", 1)
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")

# Mirror only authenticated call traffic to the colocated Homer HEP listener.
# Automatic trace_mode is disabled so scanner traffic, OPTIONS, REGISTER, and
# requests rejected before source authentication never reach Homer. Explicit
# tracing below covers trusted initial transactions and their in-dialog traffic.
modparam("siptrace", "duplicate_uri", "sip:127.0.0.1:9060")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("siptrace", "hep_capture_id", 61)
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "trace_on", 1)
modparam("siptrace", "trace_init_mode", 2)
modparam("siptrace", "trace_mode", 0)

event_route[xhttp:request] {
    if ($hu == "/ping") {
        xhttp_reply("200", "OK", "application/json", "{\"ok\":true}");
        exit;
    }
    if ($hu == "/rpc") {
        if ($rm != "POST") {
            xhttp_reply("405", "Method Not Allowed", "text/plain", "POST required");
            exit;
        }
        jsonrpc_dispatch();
        exit;
    }
    xhttp_reply("404", "Not Found", "text/plain", "no route");
    exit;
}

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511")) {
        sl_send_reply("400", "Bad Request");
        exit;
    }
    force_rport();

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(TRACE_SIP);
            t_relay();
        }
        exit;
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # Carrier -> FreeSWITCH: inbound DID routing.
    if (allow_address(CARRIER_GRP, "$si", "$sp")) {
        xlog("L_INFO", "CARRIER->FS: ci=$ci from=$fu dest=$rU src=$si:$sp\n");
        route(TRACE_SIP);
        sl_send_reply("100", "Trying");
        record_route();
        # Never trust routing metadata supplied by an external SIP peer.
        remove_hf("X-Dest-Host");
        remove_hf("X-Dest-Transport");
        remove_hf("X-Carrier-Host");
        remove_hf("X-Carrier-Transport");
        remove_hf("X-Customer-ID");
        remove_hf("X-Call-Direction");
        remove_hf("X-Source-IP");
        remove_hf("X-Source-Port");
        append_hf("X-Call-Direction: inbound\r\n");
        append_hf("X-Source-IP: $si\r\n");
        append_hf("X-Source-Port: $sp\r\n");
        $du = FS_URI;
        force_send_socket(udp:LAN_IP:5070);
        if (!t_relay()) sl_reply_error();
        exit;
    }

    # Customer -> FreeSWITCH: outbound carrier routing.
    if (allow_address(CUSTOMER_GRP, "$si", "$sp")) {
        xlog("L_INFO", "CUSTOMER->FS: ci=$ci from=$fu dest=$rU src=$si:$sp\n");
        route(TRACE_SIP);
        sl_send_reply("100", "Trying");
        record_route();
        # Only the billing-switch XML may select the outbound destination.
        remove_hf("X-Dest-Host");
        remove_hf("X-Dest-Transport");
        remove_hf("X-Carrier-Host");
        remove_hf("X-Carrier-Transport");
        remove_hf("X-Customer-ID");
        remove_hf("X-Call-Direction");
        remove_hf("X-Source-IP");
        remove_hf("X-Source-Port");
        append_hf("X-Call-Direction: outbound\r\n");
        append_hf("X-Source-IP: $si\r\n");
        append_hf("X-Source-Port: $sp\r\n");
        $du = FS_URI;
        force_send_socket(udp:LAN_IP:5070);
        if (!t_relay()) sl_reply_error();
        exit;
    }

    # FreeSWITCH -> endpoint selected in generated XML.
    if ($si == FS_IP) {
        # UDP is the safe default. Override it only with an explicit transport
        # placed on the B-leg by the trusted billing-switch XML.
        $var(transport) = "udp";
        if (is_present_hf("X-Dest-Host")) {
            $var(dest) = $hdr(X-Dest-Host);
            if ($hdr(X-Dest-Transport) == "tcp" || $hdr(X-Dest-Transport) == "TCP") {
                $var(transport) = "tcp";
            } else if (is_present_hf("X-Dest-Transport")
                       && $hdr(X-Dest-Transport) != "udp"
                       && $hdr(X-Dest-Transport) != "UDP") {
                xlog("L_WARN", "FS->DEST: ci=$ci unsupported transport=$hdr(X-Dest-Transport); using udp\n");
            }
        } else if (is_present_hf("X-Carrier-Host")) {
            $var(dest) = $hdr(X-Carrier-Host);
            if ($hdr(X-Carrier-Transport) == "tcp" || $hdr(X-Carrier-Transport) == "TCP") {
                $var(transport) = "tcp";
            } else if (is_present_hf("X-Carrier-Transport")
                       && $hdr(X-Carrier-Transport) != "udp"
                       && $hdr(X-Carrier-Transport) != "UDP") {
                xlog("L_WARN", "FS->DEST: ci=$ci unsupported legacy transport=$hdr(X-Carrier-Transport); using udp\n");
            }
        } else {
            xlog("L_WARN", "FS->?: ci=$ci dest=$rU without X-Dest-Host/X-Carrier-Host\n");
            sl_send_reply("404", "No Destination");
            exit;
        }
        route(TRACE_SIP);
        xlog("L_INFO", "FS->DEST: ci=$ci dest=$rU target=$var(dest) transport=$var(transport)\n");
        record_route();
        if ($var(transport) == "tcp") {
            $ru = "sip:" + $rU + "@" + $var(dest) + ";transport=tcp";
            force_send_socket(tcp:PUBLIC_IP:5060);
        } else {
            # TLS requires a TLS listener, tls.so, and certificate configuration.
            $ru = "sip:" + $rU + "@" + $var(dest);
            force_send_socket(udp:PUBLIC_IP:5060);
        }
        remove_hf("X-Dest-Host");
        remove_hf("X-Dest-Transport");
        remove_hf("X-Carrier-Host");
        remove_hf("X-Carrier-Transport");
        remove_hf("X-Call-Direction");
        remove_hf("X-Source-IP");
        remove_hf("X-Source-Port");
        if (!t_relay()) sl_reply_error();
        exit;
    }

    xlog("L_WARN", "BLOCKED: source=$si:$sp method=$rm dest=$rU\n");
    sl_send_reply("403", "Forbidden");
    exit;
}

route[WITHINDLG] {
    # ACK for a 2xx response and every later in-dialog request must follow the
    # route set established by Record-Route.  Processing loose_route() first is
    # especially important on the FreeSWITCH side of the public/LAN double RR.
    if (loose_route()) {
        route(TRACE_SIP);
        remove_hf("X-Dest-Host");
        remove_hf("X-Dest-Transport");
        remove_hf("X-Carrier-Host");
        remove_hf("X-Carrier-Transport");
        remove_hf("X-Call-Direction");
        remove_hf("X-Source-IP");
        remove_hf("X-Source-Port");

        # Every established dialog has FreeSWITCH on one side. FreeSWITCH
        # advertises its public SIP address in Contact, but Kamailio must reach
        # it through the LAN socket. Do not depend on a permissions-table port
        # match here: destination endpoints can legitimately send in-dialog
        # traffic from a different SIP port than their ingress-auth entry.
        # This cannot become an open relay because the destination is fixed.
        if ($si != FS_IP) {
            $du = FS_URI;
            force_send_socket(udp:LAN_IP:5070);
        }
        xlog("L_INFO", "in-dialog $rm $ci from $si:$sp to $du ruri=$ru\n");
        route(RELAY);
        exit;
    }

    # A non-2xx ACK can be associated with the original INVITE transaction
    # without carrying a loose Route set.
    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(TRACE_SIP);
            route(RELAY);
        }
        exit;
    }

    sl_send_reply("404", "Dialog route not found");
    exit;
}

# Explicit tracing is invoked only after the message has been associated with
# an authenticated source or an existing Record-Route/transaction. Transaction
# mode captures the request and its replies; ACK has no reply transaction and
# is therefore mirrored as a single message.
route[TRACE_SIP] {
    if (is_method("ACK")) {
        sip_trace("sip:127.0.0.1:9060", "$ci", "m");
    } else {
        sip_trace("sip:127.0.0.1:9060", "$ci", "t");
    }
    return;
}

route[RELAY] {
    if (!t_relay()) sl_reply_error();
    exit;
}
